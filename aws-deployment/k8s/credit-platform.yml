# ============================================================
# Credit Platform - Kubernetes Deployment
# Covers "Kubernetes" skill from resume
# Deploy to Amazon EKS
# ============================================================

# ── Namespace ─────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: credit-platform

---
# ── ConfigMap (shared config for all services) ────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: credit-platform-config
  namespace: credit-platform
data:
  EUREKA_URL: "http://eureka-service:8761/eureka"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  REDIS_HOST: "redis-service"
  DB_HOST: "your-rds-endpoint.ap-south-1.rds.amazonaws.com"
  AWS_REGION: "ap-south-1"

---
# ── Secret (sensitive values) ─────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: credit-platform-secrets
  namespace: credit-platform
type: Opaque
stringData:
  DB_PASSWORD: "CreditDb@2024"
  REDIS_PASSWORD: "Redis@2024"
  JWT_SECRET: "bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjEyMzQ1"
  SENDGRID_API_KEY: "SG.mock_key"

---
# ── Eureka Service Discovery ──────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: credit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka
          image: steeltoeoss/eureka-server:latest
          ports:
            - containerPort: 8761
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  namespace: credit-platform
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
  type: ClusterIP

---
# ── Onboarding Service ────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-service
  namespace: credit-platform
  labels:
    app: onboarding-service
    version: IMAGE_TAG
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onboarding-service
  template:
    metadata:
      labels:
        app: onboarding-service
    spec:
      containers:
        - name: onboarding-service
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/credit/onboarding-service:IMAGE_TAG
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: credit-platform-config
            - secretRef:
                name: credit-platform-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(DB_HOST):3306/credit_onboarding_db?useSSL=true&serverTimezone=UTC"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-service
  namespace: credit-platform
spec:
  selector:
    app: onboarding-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

---
