server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Onboarding Service
        - id: onboarding-service
          uri: lb://onboarding-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/kyc/**, /api/v1/documents/**, /api/v1/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: onboardingCB
                fallbackUri: forward:/fallback/onboarding

        # Loan Service
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/v1/loans/**
          filters:
            - JwtAuthenticationFilter
            - name: CircuitBreaker
              args:
                name: loanCB
                fallbackUri: forward:/fallback/loan

        # Disbursement Service
        - id: disbursement-service
          uri: lb://disbursement-service
          predicates:
            - Path=/api/v1/disbursements/**
          filters:
            - JwtAuthenticationFilter

        # Repayment Service
        - id: repayment-service
          uri: lb://repayment-service
          predicates:
            - Path=/api/v1/repayments/**, /api/v1/emi/**
          filters:
            - JwtAuthenticationFilter

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "https://creditplatform.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

  # Rate limiting using Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjEyMzQ1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

resilience4j:
  circuitbreaker:
    instances:
      onboardingCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      loanCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
