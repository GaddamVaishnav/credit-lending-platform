version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: credit-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: credit_user
      MYSQL_PASSWORD: credit_pass
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: credit-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispass

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: credit-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: credit-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mongo:
    image: mongo:7
    container_name: credit-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: credit-eureka
    ports:
      - "8761:8761"

volumes:
  mysql_data:
  mongo_data:
